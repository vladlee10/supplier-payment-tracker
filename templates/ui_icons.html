{% macro icon(name, size=20) -%}

{% elif name == 'wallet' %}<path d="M20 8V5a2 2 0 0 0-2-2H6a3 3 0 0 0 0 6h14v12H6a3 3 0 0 1-3-3V6m17 7h-5v4h5"/><path d="M16.5 15h.01"/>
{% elif name == 'check' %}<path d="m8 12 3 3 5-6"/><circle cx="12" cy="12" r="9"/>
{% elif name == 'upload' %}<path d="M12 16V3m-4 4 4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>
{% elif name == 'document' %}<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Zm0 0v6h6M8 13h8m-8 4h5"/>

{% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>
{% elif name == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == 'chevron-left' %}<path d="m15 5-7 7 7 7"/>
{% elif name == 'chevron-right' %}<path d="m9 5 7 7-7 7"/>

{% elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-9h.01"/>

</svg>
